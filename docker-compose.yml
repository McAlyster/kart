services:
  web:
    build:
      context: .
      dockerfile: ./config/web/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: kart_web
    volumes:
      - ./app:/app
      - ./media:/app/media
      - ./static:/app/static
      - ./config/web/entrypoint.sh:/app/entrypoint.sh
    entrypoint: /app/entrypoint.sh
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    ports:
      - "${KART_WEB_HOST_PORT}:8000"
    networks:
      kart_net:
        ipv4_address: ${KART_WEB_IPV4}

  nginx:
    image: nginx:latest
    container_name: kart_nginx
    ports:
      - "${KART_NGINX_HOST_PORT}:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      - web
    networks:
      kart_net:
        ipv4_address: ${KART_NGINX_IPV4}
  

volumes:
  static_volume:


networks:
  kart_net:
    name: ${KART_NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${KART_SUBNET}
          gateway: ${KART_GATEWAY}


