[tox]
envlist=py38
#
skipsdist=True

[testenv:py38]
deps =
        -rrequirements.txt
        -rrequirements-dev.txt
        psycopg2-binary # PostgreSQL database adapter for Python
commands =
        ruff check assets common diffusion people production school
        pytest --cov=assets --cov=common --cov=diffusion --cov=people --cov=production --cov=school --cov-report term
